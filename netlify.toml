[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.processing]
  skip_processing = false

[context.production]
  environment = { NETLIFY_DRAWER = "false" }

[context.deploy-preview]
  environment = { NETLIFY_DRAWER = "false" }

[context.branch-deploy]
  environment = { NETLIFY_DRAWER = "false" }
